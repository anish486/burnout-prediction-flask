<!DOCTYPE html>
<html>
<head>
    <title>Student Burnout Detection</title>
</head>
<body>
    <h2>Student Burnout Detection System using AI</h2>

    <form method="POST">
        <label>Typing Speed (wpm)</label><br>
        <input type="number" name="typing_speed" required><br><br>

        <label>Study Hours per Day</label><br>
        <input type="number" name="study_hours" required><br><br>

        <label>Breaks per Day</label><br>
        <input type="number" name="breaks" required><br><br>

        <label>Active Hours</label><br>
        <input type="number" name="active_hours" required><br><br>

        <button type="submit">Check Burnout Risk</button>
    </form>

    <h3>{{ result }}</h3>

    <p><small>
        Disclaimer: This system is for educational purposes only.
        It does not diagnose mental health conditions.
    </small></p>
</body>
</html>
